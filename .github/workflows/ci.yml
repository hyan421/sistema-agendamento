name: Validacao
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: navalha
          POSTGRES_PASSWORD: ci_disposable_password
          POSTGRES_DB: navalha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U navalha -d navalha"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      APP_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://navalha:ci_disposable_password@localhost:5432/navalha
      SESSION_SECRET: ci_disposable_session_secret_not_for_production
      SHOP_TIMEZONE: America/Sao_Paulo
      AI_PROVIDER: fallback
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run db:migrate
      - run: node scripts/validation/run.mjs
      - run: node scripts/validation/assistant.mjs
      - name: Verificar commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            npm run commits:check -- "$BASE_SHA..HEAD"
          else
            npm run commits:check -- HEAD
          fi
